plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = '1.12-4.2.1-fork'
group = 'com.m4thg33k.tombmanygraves'

base {
    archivesName = 'TombManyGraves'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    options.release = 8
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Developer'
    injectedTags.put('VERSION', project.version)
}

repositories {
    maven {
        name = 'CleanroomMC Maven'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    compileOnly rfg.deobf('mezz.jei:jei_1.12.2:4.16.1.301')
    compileOnly rfg.deobf('com.github.azanor:Baubles:7035b13')

    compileOnly rfg.deobf('curse.maven:aether-255308:6316434')
    compileOnly rfg.deobf('curse.maven:angry-pixel-the-betweenlands-mod-243363:4479688')
    compileOnly rfg.deobf('curse.maven:galacticraft-legacy-564236:4399905')
    compileOnly rfg.deobf('curse.maven:techguns-ce-1417575:7409099')

    compileOnly files('libs/backpack-3.0.2-1.12.2.jar')
    compileOnly files('libs/CosmeticArmorReworked-1.12.2-v5a.jar')
}

tasks.processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft.mcVersion
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': minecraft.mcVersion
    }
}